name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: bundle exec rspec
        working-directory: ruby
      - name: Verify tag and package versions
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/check-release.mjs
          for file in packages/core/package.json packages/prisma/package.json packages/drizzle/package.json packages/ollama/package.json; do
            VERSION=$(node -p "require('./$file').version")
            test "$VERSION" = "$TAG_VERSION"
          done
          GEM_VERSION=$(ruby -e 'spec = Gem::Specification.load("ruby/agentic_query.gemspec"); puts spec.version')
          test "$GEM_VERSION" = "$TAG_VERSION"

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r build
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @agentic-query/core publish --no-git-checks --access public
          pnpm --filter @agentic-query/prisma publish --no-git-checks --access public
          pnpm --filter @agentic-query/drizzle publish --no-git-checks --access public
          pnpm --filter @agentic-query/ollama publish --no-git-checks --access public

  publish-rubygem:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ruby
      - name: Build gem
        working-directory: ruby
        run: gem build agentic_query.gemspec
      - name: Publish gem
        working-directory: ruby
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push agentic_query-*.gem

  github-release:
    needs: [publish-npm, publish-rubygem]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
